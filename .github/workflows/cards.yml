name: Refresh stat cards

# 用官方渲染核心（github-readme-stats 血统，MIT）生成统计卡/语言卡/置顶卡，
# 提交进仓库后由 README 以本地路径引用 —— 不依赖任何第三方运行时图片服务。
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cards-refresh
  cancel-in-progress: true

env:
  BRANCH_PREFIX: profile-cards/

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
          cache: npm

      - name: Install render core
        run: npm ci --no-audit --no-fund

      - name: Render cards (this account only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 只渲染本仓库所属账号：避免把其它账号的数据混进本仓库产物
        run: node scripts/render_cards.mjs "$(python3 -c "import json;print(json.load(open('profile.json'))['account'])")"

      - name: Regenerate READMEs from new cards
        run: python3 scripts/generate.py --here

      - name: Publish when content changed
        # 仓库若禁止默认令牌创建 PR，请在 Settings → Secrets 配置 PROFILE_PAT（classic, repo 权限）
        env:
          GH_TOKEN: ${{ secrets.PROFILE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -u
          if git diff --quiet; then
            echo "no changes to publish"
            exit 0
          fi

          # 同 refresh.yml：先回收上一轮遗留 PR/分支，任何时刻至多一个待办
          stale=$(gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"$BRANCH_PREFIX\")) | .number")
          for n in $stale; do
            gh pr close "$n" --delete-branch --comment "superseded by a newer cards run" || true
          done

          branch="${BRANCH_PREFIX}$(date -u +%Y%m%d-%H%M)"
          git config user.name "profile-kit"
          git config user.email "profile-kit@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore: refresh stat cards"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: refresh stat cards ($(date -u +%F))" \
            --body "自动刷新：官方渲染核心生成的统计卡/语言卡/置顶卡（本地资产，无第三方运行时依赖）。"

          # 合并状态机：主动收敛到「已合并」，而不是启用 auto-merge 就退出。
          # 实测教训：GitHub 的 auto-merge 在 BEHIND 状态不会自动前进，
          # 「启用成功即退出」会让并发场景下的 PR 永久 hanging。
          #   CLEAN   → 立即 squash 合并（含无分支保护仓库）
          #   BEHIND  → 更新分支后重试
          #   BLOCKED → 检查未出/需批准，等待
          # 轮次耗尽后保留 PR 待批（受保护仓库的 gitleaks 人工批准路径），下一轮 supersede。
          for i in $(seq 1 10); do
            state=$(gh pr view "$branch" --json mergeStateStatus -q .mergeStateStatus 2>/dev/null || echo UNKNOWN)
            echo "attempt $i: mergeStateStatus=$state"
            case "$state" in
              CLEAN|HAS_HOOKS|UNSTABLE)
                if gh pr merge --squash 2>/dev/null; then
                  echo "merged"
                  exit 0
                fi
                ;;
              BEHIND)
                gh pr update-branch "$branch" 2>/dev/null || true
                ;;
            esac
            sleep 15
          done
          # 仍未合并：可能是需要人工批准（受保护分支 + 机器人 PR）。
          # 启用 auto-merge 让它在批准后自动完成，下一轮 run 负责 supersede。
          gh pr merge --auto --squash 2>/dev/null || true
          echo "PR left open (likely awaiting approval); next run will supersede it"
