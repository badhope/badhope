# ============================================================================
# 镜像工作流 —— 仅 badhope 仓库携带（github/badhope 在 GitCode / Gitee 也有主页）。
#
# 设计前提（重要）：三个平台的主页文案本来就不同 ——
#   github/badhope  面向 GitHub 读者（109 行 README）
#   gitcode/badhope 面向国内读者（94 行，强调"国内镜像站 + 移动端实验场"）
#   gitee/badhope   同上（89 行）
# 因此镜像**只同步共享层**（accounts.py、data/ 数据、assets/ 自绘资产、scripts/），
# **不覆盖 README 与 profile.json**，否则会把国内站的文案改回 GitHub 版。
#
# 触发：push 到 main 后自动跑；也可 workflow_dispatch 手动同步。
#
# 前置 Secret：
#   GITCODE_TOKEN   GitCode 令牌（Basic 鉴权，写入用 oauth2:TOKEN@）
#   GITEE_TOKEN     Gitee 令牌
# ============================================================================

name: Mirror to GitCode & Gitee

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHARED_PATHS: accounts.py data assets scripts .gitignore
      KEEP_PATHS: README.md README.zh-CN.md README.ja.md profile.json .github
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror shared layer to GitCode
        env:
          TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: bash scripts/mirror-shared.sh gitcode

      - name: Mirror shared layer to Gitee
        env:
          TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: bash scripts/mirror-shared.sh gitee
