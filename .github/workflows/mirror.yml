# ============================================================================
# 镜像工作流 —— 仅 badhope 仓库携带。
# 目标：GitCode、Gitee、GitHub X33834、GitHub Morningstar202604。
#
# 设计前提：五个主页共享同一份生成器（build.py + scripts + tests），
# 但每个账号保留自己的 profile.json / data/stats.json / 文案与产物。
# 镜像只同步账号无关的共享层，然后在目标仓库里按目标账号原地重建。
#
# 触发：push 到 main 后自动跑；也可 workflow_dispatch 手动同步。
#
# 前置 Secret：
#   GITCODE_TOKEN       GitCode 令牌（通过 GIT_ASKPASS 传入，不写入 URL）
#   GITEE_TOKEN         Gitee 令牌
#   X33834_TOKEN        GitHub X33834 的 PAT（repo 权限）
#   MORNINGSTAR_TOKEN   GitHub Morningstar202604 的 PAT（repo 权限）
# ============================================================================

name: Mirror shared layer to five profiles

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 共享层清单统一由 scripts/mirror-shared.sh 的默认 SHARED_PATHS 维护；
    # 这里不要再覆盖 —— 旧版曾因两处清单漂移（缺 kit/、带整个 assets/）
    # 造成镜像端 ImportError 与跨账号资产污染（回灌事故的直接根因）。
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mirror shared layer to GitCode
        env:
          TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "未配置 GITCODE_TOKEN，跳过 GitCode 镜像"
            exit 0
          fi
          bash scripts/mirror-shared.sh gitcode

      - name: Mirror shared layer to Gitee
        env:
          TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "未配置 GITEE_TOKEN，跳过 Gitee 镜像"
            exit 0
          fi
          bash scripts/mirror-shared.sh gitee

      - name: Mirror shared layer to GitHub X33834
        env:
          TOKEN: ${{ secrets.X33834_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "未配置 X33834_TOKEN，跳过 X33834 镜像"
            exit 0
          fi
          bash scripts/mirror-shared.sh github-x33834

      - name: Mirror shared layer to GitHub Morningstar202604
        env:
          TOKEN: ${{ secrets.MORNINGSTAR_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "未配置 MORNINGSTAR_TOKEN，跳过 Morningstar 镜像"
            exit 0
          fi
          bash scripts/mirror-shared.sh github-morningstar
