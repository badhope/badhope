name: Validate profile

# No schedule. No auto-merge. No direct push to main.
# This workflow only runs when a maintainer opens a PR or pushes manually,
# and only checks that the generated README is consistent with the live data.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Regenerate README and verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sanity-check asset files
        run: |
          for f in assets/taiji.svg assets/starry-banner.svg assets/starry-band.svg; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty"
              exit 1
            fi
          done
          echo "assets OK"

      - name: Verify AUTO markers are populated
        run: |
          python - <<'PY'
          import re, sys
          files = ["README.md", "README.zh-CN.md"]
          marker = re.compile(r"<!--\s*AUTO:([A-Z0-9_]+):START\s*-->\s*(.*?)<!--\s*AUTO:\1:END\s*-->", re.DOTALL)
          ok = True
          for path in files:
              txt = open(path, encoding="utf-8").read()
              for m in marker.finditer(txt):
                  key, body = m.group(1), m.group(2).strip()
                  if not body:
                      print(f"::error::{path}: marker {key} is empty")
                      ok = False
              print(f"{path}: markers look populated")
          sys.exit(0 if ok else 1)
          PY

      - name: Python syntax check on script
        run: |
          python -m py_compile scripts/generate.py
          echo "scripts/generate.py compiles cleanly"
      # NOTE: We deliberately do NOT re-run the generator in CI, because
      # the daily quote and (potentially) CSDN feed will differ between
      # the PR-creator moment and the CI moment, and a non-deterministic
      # diff would just be noise. The AUTO-marker check above is the real
      # structural test.
