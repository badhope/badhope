name: refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC

permissions:
  contents: write

concurrency:
  group: refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stats:
    name: refresh stats snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Refresh stats (github)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh_sections.py --section stats --platform github

      - name: Refresh stats (gitee)
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: python3 scripts/refresh_sections.py --section stats --platform gitee

      - name: Refresh stats (gitcode)
        continue-on-error: true
        run: python3 scripts/refresh_sections.py --section stats --platform gitcode

      - name: Rebuild page with fresh numbers
        run: python3 scripts/generate.py --here

      - name: Offline gate
        run: |
          python3 scripts/verify.py
          python3 scripts/release.py --check

      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "badhope"
            git config user.email "badhope@users.noreply.github.com"
            git add data/stats.json README.md README.zh-CN.md README.ja.md assets/
            git commit -m "chore: refresh stats snapshot"
            git push
          else
            echo "no changes"
          fi
