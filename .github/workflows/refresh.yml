name: Refresh profile

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh stats (GitHub / Gitee / GitCode)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: python3 scripts/refresh.py

      - name: Regenerate READMEs and assets
        run: python3 scripts/generate.py --here

      - name: Commit and push
        run: |
          git config user.name "profile-kit"
          git config user.email "profile-kit@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: refresh profile [skip ci]"
            git push
          fi
