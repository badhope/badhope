# ============================================================================
# 动态刷新工作流 —— 每个分区独立刷新、独立容错、无变化不提交（省配额）。
#
# 设计原则（对应需求：分区动态、用平台 Action、不频繁、不超余额、不冻结卡片）：
#   - 统计 / 文章：每日 17:23 UTC 拉取最新数据（fail-soft，单账号失败保留旧值）。
#   - 贡献蛇图：每日 17:23 UTC 用官方 snk 动作重绘（直接写 assets/，保留旧图）。
#   - 卡片（stats/langs/pin）：每周一 04:47 UTC 重渲染——GitHub API 调用较多，故低频。
#   - README + 资产：每次数据变动后离线重建（generate.py 纯 stdlib，确定可复现）。
#   - 变更闸门：git diff 无变化即跳过提交 —— 大多数日子是空跑，几乎零配额消耗。
#   - 任一分区失败都不影响整体（continue-on-error / 异常被吞）。
#
# 前置 Secret（仓库 Settings → Secrets and variables → Actions）：
#   GITHUB_TOKEN   自动提供（无需手动建），用于 GitHub API 与推送本仓库。
#   GITCODE_TOKEN  仅 badhope 仓库需要，用于把成品镜像到 GitCode。
#   GITEE_TOKEN    仅 badhope 仓库需要，用于把成品镜像到 Gitee。
# ============================================================================

name: Refresh profile (dynamic)

on:
  schedule:
    - cron: "23 17 * * *"     # 每日 17:23 UTC —— 数据 + 文章 + 贡献蛇 + README
    - cron: "47 4 * * 1"      # 每周一 04:47 UTC —— 重渲染卡片
  workflow_dispatch:          # 手动触发：跑全部分区

permissions:
  contents: write             # 直接提交到 main（见 docs/DYNAMIC_REFRESH.md 的配额与保护说明）

concurrency:
  group: profile-refresh
  cancel-in-progress: false   # 刷新不应被并发取消，避免半成品提交

env:
  PYTHONUNBUFFERED: "1"
  TZ: UTC

jobs:
  # --------------------------------------------------------------------------
  # 每日：数据 + 文章 + 贡献蛇 + README 重建
  # --------------------------------------------------------------------------
  refresh:
    name: Data + README (daily)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '23 17 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh stats + writing (fail-soft, change-aware)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: python3 scripts/refresh_sections.py --section all

      - name: Regenerate README + assets (offline, deterministic)
        run: python3 scripts/generate.py --here

      - name: Generate contribution snake (overwrites assets/ directly)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "no content change — skip commit (quota saved)"
            exit 0
          fi
          git config user.name  "profile-kit"
          git config user.email "profile-kit@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh profile (${{ github.run_id }})"
          git push origin HEAD:main

  # --------------------------------------------------------------------------
  # 每周：重渲染 stats/langs/pin 卡片（GitHub API 调用较多 → 低频执行）
  # --------------------------------------------------------------------------
  cards:
    name: Render cards (weekly)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '47 4 * * 1')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install card renderer deps (cached)
        run: npm ci

      - name: Render stats / langs / pinned cards (GitHub API)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/render_cards.mjs

      - name: Regenerate README + assets
        run: python3 scripts/generate.py --here

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "cards unchanged — skip commit (quota saved)"
            exit 0
          fi
          git config user.name  "profile-kit"
          git config user.email "profile-kit@users.noreply.github.com"
          git add -A
          git commit -m "chore: re-render cards (${{ github.run_id }})"
          git push origin HEAD:main
