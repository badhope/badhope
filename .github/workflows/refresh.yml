name: Refresh profile

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

env:
  BRANCH_PREFIX: profile-refresh/

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Refresh stats (GitHub / Gitee / GitCode)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: python3 scripts/refresh.py

      - name: Regenerate READMEs and assets
        run: python3 scripts/generate.py --here

      - name: Publish when content changed
        # 仓库若禁止默认令牌创建 PR，请在 Settings → Secrets 配置 PROFILE_PAT（classic, repo 权限）
        env:
          GH_TOKEN: ${{ secrets.PROFILE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -u
          if git diff --quiet; then
            echo "no changes to publish"
            exit 0
          fi

          # 清理上一轮遗留的同类 PR/分支：任何时刻至多保留一个待办。
          # 每日任务在无人审批的仓库（受保护分支 + 机器人 PR 需批准）会产生堆积，这里自愈。
          stale=$(gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"$BRANCH_PREFIX\")) | .number")
          for n in $stale; do
            gh pr close "$n" --delete-branch --comment "superseded by a newer refresh run" || true
          done

          branch="${BRANCH_PREFIX}$(date -u +%Y%m%d-%H%M)"
          git config user.name "profile-kit"
          git config user.email "profile-kit@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore: refresh profile stats"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: refresh profile stats ($(date -u +%F))" \
            --body "自动刷新：data/stats.json 及 README/资产更新；合入后生效。"

          # 合并路径（按仓库能力自愈）：
          #   1) 无分支保护的仓库：--auto 会被拒（no rules），退化为立即 squash；
          #   2) 受保护仓库：--auto 成功，但并发时另一 PR 先合入会让本 PR 变成 behind，
          #      auto-merge 会一直等待 —— 故每轮先更新分支再重试；
          #   3) 需人工批准的场景：保留 PR 待批，下一轮 supersede。
          for i in 1 2 3 4; do
            if [ "$i" -gt 1 ]; then
              gh pr update-branch "$branch" 2>/dev/null || gh pr update-branch 2>/dev/null || true
              sleep 8
            fi
            if gh pr merge --auto --squash 2>/dev/null; then
              echo "auto-merge enabled (attempt $i)"
              exit 0
            fi
            if gh pr merge --squash 2>/dev/null; then
              echo "merged immediately (attempt $i)"
              exit 0
            fi
            echo "merge attempt $i pending (behind or approval required)"
            sleep 12
          done
          echo "PR left open for approval; next run will supersede it"
