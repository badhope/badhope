name: Refresh profile

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

env:
  BRANCH_PREFIX: profile-refresh/

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Refresh stats (GitHub / Gitee / GitCode)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: python3 scripts/refresh.py

      - name: Regenerate READMEs and assets
        run: python3 scripts/generate.py --here

      - name: Publish when content changed
        # 仓库若禁止默认令牌创建 PR，请在 Settings → Secrets 配置 PROFILE_PAT（classic, repo 权限）
        env:
          GH_TOKEN: ${{ secrets.PROFILE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -u
          if git diff --quiet; then
            echo "no changes to publish"
            exit 0
          fi

          # 清理上一轮遗留的同类 PR/分支：任何时刻至多保留一个待办。
          # 每日任务在无人审批的仓库（受保护分支 + 机器人 PR 需批准）会产生堆积，这里自愈。
          stale=$(gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"$BRANCH_PREFIX\")) | .number")
          for n in $stale; do
            gh pr close "$n" --delete-branch --comment "superseded by a newer refresh run" || true
          done

          branch="${BRANCH_PREFIX}$(date -u +%Y%m%d-%H%M)"
          git config user.name "profile-kit"
          git config user.email "profile-kit@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore: refresh profile stats"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: refresh profile stats ($(date -u +%F))" \
            --body "自动刷新：data/stats.json 及 README/资产更新；合入后生效。"

          # 合并状态机：主动收敛到「已合并」，而不是启用 auto-merge 就退出。
          # 实测教训：GitHub 的 auto-merge 在 BEHIND 状态不会自动前进，
          # 「启用成功即退出」会让并发场景下的 PR 永久 hanging。
          #   CLEAN   → 立即 squash 合并（含无分支保护仓库）
          #   BEHIND  → 更新分支后重试
          #   BLOCKED → 检查未出/需批准，等待
          #   DIRTY/CONFLICTING → 无人处理，失败退出（由下一轮 supersede）
          # 轮次耗尽后保留 PR 待批（受保护仓库的 gitleaks 人工批准路径），下一轮 supersede。
          for i in $(seq 1 10); do
            state=$(gh pr view "$branch" --json mergeStateStatus -q .mergeStateStatus 2>/dev/null || echo UNKNOWN)
            echo "attempt $i: mergeStateStatus=$state"
            case "$state" in
              CLEAN|HAS_HOOKS|UNSTABLE)
                if gh pr merge --squash 2>/dev/null; then
                  echo "merged"
                  exit 0
                fi
                ;;
              BEHIND)
                gh pr update-branch "$branch" 2>/dev/null || true
                ;;
            esac
            sleep 15
          done
          # 仍未合并：可能是需要人工批准（受保护分支 + 机器人 PR）。
          # 启用 auto-merge 让它在批准后自动完成，下一轮 run 负责 supersede。
          gh pr merge --auto --squash 2>/dev/null || true
          echo "PR left open (likely awaiting approval); next run will supersede it"
