name: Contribution snake

# 蛇形图以 data/contrib/<account>/ 种子为唯一数据源：
# 本工作流只负责「生成种子」，assets/ 下的产物一律由 generate.py 从种子派生，
# 与 refresh.yml 共用同一条链路 —— 避免两个工作流每日互相覆盖。
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: contrib-snake
  cancel-in-progress: true

env:
  BRANCH_PREFIX: contrib-snake/

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve account key
        id: acct
        run: |
          key=$(python3 -c "import json;print(json.load(open('profile.json'))['account'])")
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "account key: $key"

      - name: Generate snake seeds (dark + light)
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            data/contrib/${{ steps.acct.outputs.key }}/snake-dark.svg?palette=github-dark&color_snake=%23C9A86A&color_dots=%23141B33,%231F2A4A,%232C3C67,%233E528C,%23C9A86A
            data/contrib/${{ steps.acct.outputs.key }}/snake.svg?palette=github-light&color_snake=%23C9A86A

      - name: Derive assets from seeds
        run: python3 scripts/generate.py --here

      - name: Publish when content changed
        # 仓库若禁止默认令牌创建 PR，请在 Settings → Secrets 配置 PROFILE_PAT（classic, repo 权限）
        env:
          GH_TOKEN: ${{ secrets.PROFILE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -u
          if git diff --quiet; then
            echo "no changes to publish"
            exit 0
          fi

          # 同 refresh.yml：先回收上一轮遗留 PR/分支，任何时刻至多一个待办
          stale=$(gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"$BRANCH_PREFIX\")) | .number")
          for n in $stale; do
            gh pr close "$n" --delete-branch --comment "superseded by a newer snake run" || true
          done

          branch="${BRANCH_PREFIX}$(date -u +%Y%m%d-%H%M)"
          git config user.name "profile-kit"
          git config user.email "profile-kit@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore: refresh contribution snake"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: refresh contribution snake ($(date -u +%F))" \
            --body "自动刷新贡献蛇形图（Platane/snk 种子 → generate.py 派生 assets）；合入后生效。"

          # 合并路径（按仓库能力自愈）：
          #   1) 无分支保护的仓库：--auto 会被拒（no rules），退化为立即 squash；
          #   2) 受保护仓库：--auto 成功，但并发时另一 PR 先合入会让本 PR 变成 behind，
          #      auto-merge 会一直等待 —— 故每轮先更新分支再重试；
          #   3) 需人工批准的场景：保留 PR 待批，下一轮 supersede。
          for i in 1 2 3 4; do
            if [ "$i" -gt 1 ]; then
              gh pr update-branch "$branch" 2>/dev/null || gh pr update-branch 2>/dev/null || true
              sleep 8
            fi
            if gh pr merge --auto --squash 2>/dev/null; then
              echo "auto-merge enabled (attempt $i)"
              exit 0
            fi
            if gh pr merge --squash 2>/dev/null; then
              echo "merged immediately (attempt $i)"
              exit 0
            fi
            echo "merge attempt $i pending (behind or approval required)"
            sleep 12
          done
          echo "PR left open for approval; next run will supersede it"
