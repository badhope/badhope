name: Profile 3D Contrib

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d-contrib
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Keep only the variant referenced by the READMEs
        run: |
          cd profile-3d-contrib
          ls | grep -v '^profile-green-animate\.svg$' | xargs -r rm -f
          ls -lh

      - name: Convert 3D graph to PNG for maximum compatibility
        run: |
          python3 -m pip install --quiet --user cairosvg
          python3 - <<'EOF'
          import cairosvg
          cairosvg.svg2png(
              url='profile-3d-contrib/profile-green-animate.svg',
              write_to='assets/3d-contrib-green.png',
              output_width=1280, output_height=850,
          )
          EOF
          ls -lh assets/3d-contrib-green.png

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib/ assets/3d-contrib-green.png
          if git commit -m "chore: refresh 3D contribution graph [skip ci]"; then
            git pull --rebase origin main || git rebase --abort
            git push || { git fetch origin && git rebase origin/main && git push; }
          fi

      - name: Health check
        if: always()
        run: |
          echo "=== generated files ==="
          ls -lh profile-3d-contrib/ 2>/dev/null || echo "no profile-3d-contrib dir"
          echo ""
          echo "=== commit log ==="
          git log --oneline -3
