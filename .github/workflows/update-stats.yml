name: Update Profile Stats

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch live stats & projects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: python3 scripts/update_readme.py

      - name: Fetch latest blog posts
        run: python3 scripts/update_blog.py

      - name: Commit & push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh.md README.ja.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no changes to commit"
          else
            git commit -m "chore: refresh profile stats [skip ci]"
            git pull --rebase origin main || true
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
