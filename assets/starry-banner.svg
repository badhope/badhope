</g>

<!-- third star field (tC) — sparse, larger -->
<g fill="#fff7d6" class="tC">
  <circle cx="190"  cy="40"  r="1.6" opacity=".7"/>
  <circle cx="610"  cy="50"  r="1.6" opacity=".6"/>
  <circle cx="1080" cy="80"  r="1.6" opacity=".7"/>
  <circle cx="80"   cy="440" r="1.6" opacity=".6"/>
  <circle cx="380"  cy="470" r="1.6" opacity=".5"/>
