  <circle cx="220"  cy="50"  r="0.8" opacity=".8"/>
  <circle cx="320"  cy="100" r="0.6" opacity=".7"/>
  <circle cx="540"  cy="80"  r="0.6" opacity=".9"/>
  <circle cx="780"  cy="140" r="0.6" opacity=".8"/>
