  <circle cx="158"  cy="195" r="1.0" opacity=".5"/>
  <circle cx="717"  cy="152" r="1.6" opacity=".7"/>
  <circle cx="934"  cy="17"  r="0.6" opacity=".9"/>
  <circle cx="970"  cy="178" r="0.6" opacity=".3"/>
  <circle cx="634"  cy="165" r="1.6" opacity=".5"/>
  <circle cx="790"  cy="171" r="1.0" opacity=".3"/>
  <circle cx="945"  cy="90"  r="0.6" opacity=".7"/>
  <circle cx="1011" cy="15"  r="0.8" opacity=".8"/>
  <circle cx="264"  cy="189" r="0.8" opacity=".5"/>
