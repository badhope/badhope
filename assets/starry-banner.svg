<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Starry night sky with the Big Dipper">
<title>badhope · starry sky with the Big Dipper (Ursa Major)</title>
<defs>
  <!-- sky gradient: deep indigo to violet -->
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#050417"/>
    <stop offset="35%" stop-color="#0d0b30"/>
    <stop offset="75%" stop-color="#1e1b4b"/>
    <stop offset="100%" stop-color="#312e81"/>
  </linearGradient>
  <!-- soft nebula glow -->
  <radialGradient id="nebula-violet" cx="50%" cy="50%" r="50%">
    <stop offset="0%"  stop-color="#a78bfa" stop-opacity="0.18"/>
    <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="nebula-cyan" cx="50%" cy="50%" r="50%">
    <stop offset="0%"  stop-color="#67e8f9" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="nebula-pink" cx="50%" cy="50%" r="50%">
    <stop offset="0%"  stop-color="#f0abfc" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
  </radialGradient>
  <!-- star glow -->
  <radialGradient id="halo" cx="50%" cy="50%" r="50%">
    <stop offset="0%"  stop-color="#ffffff" stop-opacity="1"/>
    <stop offset="30%" stop-color="#c4b5fd" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="1.4"/>
  </filter>
  <!-- one reusable star symbol so we can sprinkle via <use> -->
  <symbol id="star-sm" overflow="visible">
    <circle r="1" fill="#e6e7ee"/>
  </symbol>
</defs>

<!-- inline animation: twinkle + halo pulse + slow drift -->
<style>
  @keyframes twinkleA { 0%,100%{opacity:.25} 50%{opacity:.95} }
  @keyframes twinkleB { 0%,100%{opacity:.55} 50%{opacity:.15} }
  @keyframes twinkleC { 0%,100%{opacity:.4 } 60%{opacity:1  } }
  @keyframes halo     { 0%,100%{opacity:.5 } 50%{opacity:1  } }
  @keyframes drift    { 0%{transform:translate3d(0,0,0)} 100%{transform:translate3d(-40px,8px,0)} }
  @keyframes shoot    { 0%{transform:translate(0,0)  ;opacity:0} 5%{opacity:1} 70%{opacity:1} 100%{transform:translate(720px,180px);opacity:0} }
  .tA { animation: twinkleA 3.2s ease-in-out infinite; }
  .tB { animation: twinkleB 4.1s ease-in-out infinite; }
  .tC { animation: twinkleC 5.6s ease-in-out infinite; }
  .h  { animation: halo     3.0s ease-in-out infinite; transform-origin:center; }
  .h2 { animation: halo     3.6s ease-in-out infinite .6s; transform-origin:center; }
  .h3 { animation: halo     4.2s ease-in-out infinite 1.2s; transform-origin:center; }
  .shooting { animation: shoot 9s linear infinite; }
  .drift    { animation: drift 60s linear infinite alternate; }
</style>

<!-- background -->
<rect width="1200" height="500" fill="url(#sky)"/>
<!-- nebula clouds (slow drift) -->
<g class="drift">
  <ellipse cx="280"  cy="180" rx="380" ry="140" fill="url(#nebula-violet)"/>
  <ellipse cx="980"  cy="320" rx="340" ry="130" fill="url(#nebula-cyan)"/>
  <ellipse cx="620"  cy="420" rx="300" ry="120" fill="url(#nebula-pink)"/>
  <ellipse cx="180"  cy="430" rx="240" ry="100" fill="url(#nebula-violet)"/>
  <ellipse cx="1080" cy="120" rx="220" ry="90"  fill="url(#nebula-cyan)"/>
</g>

<!-- background star field (tA class) -->
<g fill="#e6e7ee" class="tA">
  <circle cx="80"   cy="60"  r="1.0" opacity=".7"/>
  <circle cx="148"  cy="210" r="0.6" opacity=".5"/>
  <circle cx="118"  cy="129" r="0.8" opacity=".3"/>
  <circle cx="888"  cy="107" r="0.6" opacity=".4"/>
