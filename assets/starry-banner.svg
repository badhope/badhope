  <circle cx="980"  cy="180" r="1.4" opacity=".5"/>
  <circle cx="660"  cy="490" r="1.4" opacity=".6"/>
  <circle cx="450"  cy="60"  r="1.4" opacity=".5"/>
</g>

<!-- shooting star (drifts in every 9s) -->
<g class="shooting" opacity=".85">
  <line x1="0" y1="0" x2="-90" y2="40" stroke="#fff" stroke-width="1.4" stroke-linecap="round" filter="url(#soft)"/>
  <circle cx="0" cy="0" r="2.4" fill="#fff"/>
</g>

<!-- Big Dipper / Ursa Major — main attraction, centered around (700,210) -->
<g class="tA">
  <!-- 7 stars + connecting lines -->
  <line x1="530"  y1="90"  x2="610" y2="110" stroke="#a5b4fc" stroke-width="0.8" opacity=".55"/>
  <line x1="610"  y1="110" x2="690" y2="130" stroke="#a5b4fc" stroke-width="0.8" opacity=".55"/>
  <line x1="690"  y1="130" x2="760" y2="110" stroke="#a5b4fc" stroke-width="0.8" opacity=".55"/>
  <line x1="760"  y1="110" x2="820" y2="178" stroke="#a5b4fc" stroke-width="0.8" opacity=".55"/>
  <line x1="820"  y1="178" x2="920" y2="158" stroke="#a5b4fc" stroke-width="0.8" opacity=".55"/>
  <line x1="920"  y1="158" x2="870" y2="88"  stroke="#a5b4fc" stroke-width="0.8" opacity=".55"/>
  <line x1="870"  y1="88"  x2="760" y2="110" stroke="#a5b4fc" stroke-width="0.8" opacity=".55"/>
  <!-- halos behind stars (pulse) -->
  <circle cx="530"  cy="90"  r="18" fill="url(#halo)" class="h"/>
  <circle cx="610"  cy="110" r="22" fill="url(#halo)" class="h2"/>
  <circle cx="690"  cy="130" r="18" fill="url(#halo)" class="h3"/>
  <circle cx="760"  cy="110" r="26" fill="url(#halo)" class="h"/>
  <circle cx="820"  cy="178" r="20" fill="url(#halo)" class="h2"/>
  <circle cx="920"  cy="158" r="20" fill="url(#halo)" class="h3"/>
  <circle cx="870"  cy="88"  r="24" fill="url(#halo)" class="h"/>
  <!-- the stars themselves (solid, on top) -->
  <circle cx="530"  cy="90"  r="2.2" fill="#fff"/>
  <circle cx="610"  cy="110" r="2.8" fill="#fff"/>
  <circle cx="690"  cy="130" r="2.2" fill="#fff"/>
  <circle cx="760"  cy="110" r="3.2" fill="#fff"/>
  <circle cx="820"  cy="178" r="2.4" fill="#fff"/>
  <circle cx="920"  cy="158" r="2.4" fill="#fff"/>
  <circle cx="870"  cy="88"  r="2.8" fill="#fff"/>
</g>

<!-- accent stars (larger, halos) -->
<g>
  <circle cx="120"  cy="120" r="14" fill="url(#halo)" class="h"/>
  <circle cx="120"  cy="120" r="2.0" fill="#fff"/>
  <circle cx="1080" cy="380" r="14" fill="url(#halo)" class="h2"/>
  <circle cx="1080" cy="380" r="2.0" fill="#fff"/>
  <circle cx="60"   cy="380" r="11" fill="url(#halo)" class="h3"/>
  <circle cx="60"   cy="380" r="1.6" fill="#fff"/>
  <circle cx="1140" cy="80"  r="12" fill="url(#halo)" class="h"/>
  <circle cx="1140" cy="80"  r="1.8" fill="#fff"/>
  <circle cx="280"  cy="400" r="12" fill="url(#halo)" class="h2"/>
  <circle cx="280"  cy="400" r="1.8" fill="#fff"/>
  <circle cx="940"  cy="50"  r="11" fill="url(#halo)" class="h3"/>
  <circle cx="940"  cy="50"  r="1.6" fill="#fff"/>
  <circle cx="400"  cy="60"  r="13" fill="url(#halo)" class="h"/>
  <circle cx="400"  cy="60"  r="1.8" fill="#fff"/>
</g>

<!-- labels (English + Classical Chinese) -->
<g font-family="Cormorant Garamond, Georgia, serif" fill="#c4b5fd" opacity="0.85">
  <!-- English, top-left -->
  <text x="60" y="280" font-size="16" letter-spacing="0.5">the Big Dipper · Ursa Major</text>
  <text x="60" y="300" font-size="12" letter-spacing="0.4" fill="#a5b4fc" opacity="0.85">the seven governors of the northern sky</text>
  <!-- Classical Chinese, bottom-right -->
  <text x="1140" y="455" font-size="14" text-anchor="end" fill="#a5b4fc" opacity="0.8">观乎天文，以察时变</text>
  <!-- Northern hemisphere pointer -->
  <text x="760" y="200" font-size="10" text-anchor="middle" fill="#a5b4fc" opacity="0.6" letter-spacing="1.5">POLE</text>
</g>

<!-- Big Dipper star labels (small, fade in via class) -->
<g font-family="Cormorant Garamond, Georgia, serif" fill="#e0d4ff" opacity="0.75" font-size="9" letter-spacing="0.4">
  <text x="540"  y="80">摇光 Alkaid</text>
  <text x="620"  y="100">开阳 Mizar</text>
  <text x="700"  y="120">玉衡 Alioth</text>
  <text x="770"  y="100">天权 Megrez</text>
  <text x="830"  y="168">天玑 Phecda</text>
  <text x="930"  y="148">天璇 Merak</text>
  <text x="880"  y="78">天枢 Dubhe</text>
</g>
</svg>
