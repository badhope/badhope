  <circle cx="1140" cy="330" r="0.8" opacity=".4"/>
  <circle cx="60"   cy="330" r="0.8" opacity=".5"/>
  <circle cx="100"  cy="430" r="1.0" opacity=".4"/>
  <circle cx="160"  cy="380" r="0.6" opacity=".6"/>
  <circle cx="40"   cy="180" r="1.0" opacity=".5"/>
  <circle cx="90"   cy="80"  r="0.6" opacity=".4"/>
  <circle cx="40"   cy="40"  r="1.0" opacity=".5"/>
  <circle cx="1160" cy="40"  r="1.0" opacity=".6"/>
  <circle cx="600"  cy="60"  r="0.8" opacity=".4"/>
