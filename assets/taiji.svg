<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Tai Chi Bagua — slow rotation against a glowing nebula">
  <title>badhope · Tai Chi — slow rotation</title>
  <desc>An animated Tai Chi bagua with pulsing halos, drifting nebula clouds and a slowly rotating inner S-curve. The eight trigrams spin once per minute.</desc>

  <defs>
    <!-- background nebula glow -->
    <radialGradient id="halo-bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%"  stop-color="#A78BFA" stop-opacity="0.32"/>
      <stop offset="35%" stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#312E81" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0D0B30" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#67E8F9" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#F0ABFC" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#D946EF" stop-opacity="0"/>
    </radialGradient>

    <!-- yin / yang body shading -->
    <radialGradient id="darkOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#312E81"/>
      <stop offset="100%" stop-color="#0F0A2E"/>
    </radialGradient>

    <!-- the gold rim around the taiji -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FBBF24"/>
      <stop offset="50%"  stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- a single bright halo around the big star mark on the dark half -->
    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="35%"  stop-color="#E0E7FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style><![CDATA[
    /* the whole bagua spins — slow, contemplative */
    .spinner {
      transform-origin: 300px 300px;
      animation: spin 60s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* the dark "shadow" yin half pulses gently */
    .yin-shadow {
      animation: yinPulse 4.8s ease-in-out infinite;
      transform-origin: 300px 300px;
    }
    @keyframes yinPulse {
      0%, 100% { opacity: 1;    }
      50%      { opacity: 0.85; }
    }

    /* outer halo breathes */
    .breath {
      transform-origin: 300px 300px;
      animation: breath 6s ease-in-out infinite;
    }
    @keyframes breath {
      0%, 100% { opacity: 0.55; transform: scale(1);    }
      50%      { opacity: 0.95; transform: scale(1.04); }
    }

    /* nebula drift */
    .drift1 { animation: drift1 32s ease-in-out infinite alternate; transform-origin: 300px 300px; }
    .drift2 { animation: drift2 44s ease-in-out infinite alternate; transform-origin: 300px 300px; }
    @keyframes drift1 {
      from { transform: translate(-18px,  6px); }
      to   { transform: translate( 18px, -6px); }
    }
    @keyframes drift2 {
      from { transform: translate( 14px, -8px); }
      to   { transform: translate(-14px,  8px); }
    }

    /* star-marks twinkle */
    .twinkleA { animation: twA 3.4s ease-in-out infinite; }
    .twinkleB { animation: twB 4.2s ease-in-out infinite .8s; }
    @keyframes twA { 0%,100%{opacity:1   } 50%{opacity:.6} }
    @keyframes twB { 0%,100%{opacity:.85} 50%{opacity:1}  }

    /* trigram glyphs */
    .trigram {
      fill: #FBBF24;
      opacity: 0.85;
      font-family: "Noto Sans Symbols 2", "Segoe UI Symbol", "Apple Symbols", "Microsoft YaHei", serif;
      font-size: 44px;
      font-weight: 500;
    }
    .trigram-zh {
      fill: #C4B5FD;
      opacity: 0.7;
      font-family: "Noto Serif SC", "Source Han Serif SC", "Microsoft YaHei", serif;
      font-size: 15px;
      letter-spacing: 1px;
    }

    /* decorative rings */
    .ring {
      fill: none;
      stroke: #A78BFA;
      stroke-width: 1;
      opacity: 0.4;
    }
    .ring-dashed {
      fill: none;
      stroke: #A78BFA;
      stroke-width: 0.8;
      stroke-dasharray: 4 6;
      opacity: 0.35;
    }
    .ring-gold {
      fill: none;
      stroke: url(#rim);
      stroke-width: 1.5;
      opacity: 0.85;
    }

    .core-light { fill: #F8F7FF; }
    .core-dark  { fill: url(#darkOrb); }
    .dot-light  { fill: #0F0A2E; }
    .dot-dark   { fill: #F8F7FF; }
  ]]></style>

  <!-- deep void background -->
  <rect width="600" height="600" fill="#0D0B30"/>

  <!-- nebula clouds drifting behind everything -->
  <g class="drift1">
    <ellipse cx="180" cy="200" rx="260" ry="180" fill="url(#halo-bg)"/>
  </g>
  <g class="drift2">
    <ellipse cx="430" cy="420" rx="220" ry="160" fill="url(#nebula-cyan)"/>
  </g>
  <g class="drift1">
    <ellipse cx="460" cy="160" rx="160" ry="120" fill="url(#nebula-pink)"/>
  </g>

  <!-- outer breathing halo -->
  <g class="breath">
    <circle cx="300" cy="300" r="270" fill="url(#halo-bg)"/>
  </g>

  <!-- static decorative rings (stay still while inner spinner rotates) -->
  <circle class="ring"        cx="300" cy="300" r="252"/>
  <circle class="ring-dashed" cx="300" cy="300" r="232"/>
  <circle class="ring-gold"   cx="300" cy="300" r="220"/>

  <!-- 8 cardinal + intercardinal guide points (always upright, not in spinner) -->
  <g fill="#FBBF24" opacity="0.65">
    <circle cx="300" cy="78"  r="2.2"/>
    <circle cx="522" cy="300" r="2.2"/>
    <circle cx="300" cy="522" r="2.2"/>
    <circle cx="78"  cy="300" r="2.2"/>
  </g>

  <!-- the spinning group -->
  <g class="spinner">
    <!-- 8 trigrams around the taiji (radius ~ 188) -->
    <g class="trigram" text-anchor="middle">
      <text x="300" y="118">☰</text>   <!-- Qian 乾 · Heaven   -->
      <text x="433" y="167">☱</text>   <!-- Dui  兑 · Lake     -->
      <text x="482" y="300">☲</text>   <!-- Li   离 · Fire     -->
      <text x="433" y="433">☳</text>   <!-- Zhen 震 · Thunder  -->
      <text x="300" y="482">☴</text>   <!-- Xun  巽 · Wind     -->
      <text x="167" y="433">☵</text>   <!-- Kan  坎 · Water    -->
      <text x="118" y="300">☶</text>   <!-- Gen  艮 · Mountain -->
      <text x="167" y="167">☷</text>   <!-- Kun  坤 · Earth    -->
    </g>

    <!-- Chinese trigram names (smaller, fade in/out with spinner) -->
    <g class="trigram-zh" text-anchor="middle">
      <text x="300" y="146">乾 天</text>
      <text x="411" y="187">兑 泽</text>
      <text x="450" y="300">离 火</text>
      <text x="411" y="412">震 雷</text>
      <text x="300" y="450">巽 风</text>
      <text x="190" y="412">坎 水</text>
      <text x="150" y="300">艮 山</text>
      <text x="190" y="187">坤 地</text>
    </g>

    <!-- the gold rim around the taiji (rotates with the spinner) -->
    <circle class="ring-gold" cx="300" cy="300" r="135"/>
    <circle class="ring"      cx="300" cy="300" r="124"/>

    <!-- the light half (full white circle) -->
    <circle class="core-light" cx="300" cy="300" r="135"/>

    <!-- the dark half: an S-shape that creates the yin/yang dividing curve -->
    <path class="core-dark yin-shadow"
          d="M 300,165
             A 135,135 0 0,1 300,435
             A 67.5,67.5 0 0,0 300,300
             A 67.5,67.5 0 0,1 300,165 Z"/>

    <!-- inner seed dots -->
    <circle class="dot-light" cx="300" cy="232" r="17"/>
    <circle class="dot-dark"  cx="300" cy="368" r="17"/>

    <!-- small twinkling stars inside each seed dot -->
    <circle cx="300" cy="232" r="32" fill="url(#star-glow)" class="twinkleA"/>
    <circle cx="300" cy="368" r="32" fill="url(#star-glow)" class="twinkleB"/>
  </g>

  <!-- static label outside spinner so it stays upright -->
  <g text-anchor="middle">
    <text x="300" y="572"
          font-family="Cormorant Garamond, Georgia, serif"
          font-size="14" letter-spacing="8" fill="#C4B5FD" opacity="0.75">
      badhope · 万物负阴而抱阳
    </text>
    <text x="300" y="592"
          font-family="Cormorant Garamond, Georgia, serif"
          font-size="10" letter-spacing="4" fill="#A78BFA" opacity="0.6">
      yin &amp; yang · one revolution per minute
    </text>
  </g>
</svg>
