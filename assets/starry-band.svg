<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="100%" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Starry band divider">
<defs>
  <linearGradient id="sky2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#1e1b4b" stop-opacity="0"/>
    <stop offset="18%"  stop-color="#312e81" stop-opacity="0.65"/>
    <stop offset="50%"  stop-color="#1e1b4b" stop-opacity="0.85"/>
    <stop offset="82%"  stop-color="#312e81" stop-opacity="0.65"/>
    <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="halo2" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
    <stop offset="60%"  stop-color="#c4b5fd" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <style>
    .twinkle { animation: twinkle 3.4s ease-in-out infinite; }
    .twinkle-2 { animation: twinkle 4.2s ease-in-out infinite .7s; }
    .twinkle-3 { animation: twinkle 5.1s ease-in-out infinite 1.4s; }
    @keyframes twinkle { 0%,100%{opacity:.85} 50%{opacity:.25} }
  </style>
</defs>

<!-- gradient band background -->
<rect width="1200" height="90" fill="url(#sky2)"/>

<!-- a row of soft stars along the band (animated twinkle) -->
<g class="twinkle" fill="#e6e7ee">
  <circle cx="80"   cy="20" r="0.8" opacity="0.65"/>
  <circle cx="220"  cy="55" r="1.0" opacity="0.50"/>
  <circle cx="320"  cy="15" r="0.6" opacity="0.40"/>
  <circle cx="410"  cy="65" r="0.8" opacity="0.55"/>
  <circle cx="540"  cy="35" r="1.0" opacity="0.60"/>
  <circle cx="700"  cy="20" r="0.8" opacity="0.70"/>
  <circle cx="780"  cy="50" r="1.0" opacity="0.55"/>
  <circle cx="900"  cy="30" r="0.6" opacity="0.65"/>
  <circle cx="980"  cy="60" r="0.8" opacity="0.50"/>
  <circle cx="1080" cy="20" r="1.0" opacity="0.60"/>
  <circle cx="1150" cy="50" r="0.6" opacity="0.55"/>
</g>
<g class="twinkle-2" fill="#f0eaff">
  <circle cx="120"  cy="60" r="0.6" opacity="0.55"/>
  <circle cx="270"  cy="30" r="0.8" opacity="0.65"/>
  <circle cx="360"  cy="70" r="0.6" opacity="0.50"/>
  <circle cx="480"  cy="20" r="0.8" opacity="0.65"/>
  <circle cx="630"  cy="60" r="1.0" opacity="0.55"/>
  <circle cx="850"  cy="65" r="0.6" opacity="0.60"/>
  <circle cx="1020" cy="35" r="0.8" opacity="0.50"/>
  <circle cx="1110" cy="65" r="0.6" opacity="0.55"/>
</g>
<g class="twinkle-3" fill="#fff7d6">
  <circle cx="170"  cy="45" r="1.0" opacity="0.70"/>
  <circle cx="450"  cy="45" r="1.2" opacity="0.65"/>
  <circle cx="950"  cy="20" r="1.0" opacity="0.70"/>
</g>

<!-- 4 prominent accent stars with halos -->
<g>
  <circle cx="150"  cy="45" r="11" fill="url(#halo2)" opacity="0.7"/>
  <circle cx="150"  cy="45" r="1.6" fill="#ffffff" opacity="0.95"/>

  <circle cx="450"  cy="30" r="11" fill="url(#halo2)" opacity="0.7"/>
  <circle cx="450"  cy="30" r="1.6" fill="#ffffff" opacity="0.95"/>

  <circle cx="820"  cy="55" r="11" fill="url(#halo2)" opacity="0.7"/>
  <circle cx="820"  cy="55" r="1.6" fill="#ffffff" opacity="0.95"/>

  <circle cx="1050" cy="40" r="11" fill="url(#halo2)" opacity="0.7"/>
  <circle cx="1050" cy="40" r="1.6" fill="#ffffff" opacity="0.95"/>
</g>

<!-- centre text -->
<text x="600" y="55" text-anchor="middle"
      font-family="Cormorant Garamond, Georgia, serif"
      font-size="14" fill="#a78bfa" opacity="0.85" letter-spacing="8">·   ✦   ·</text>
</svg>
